<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>台南晶英 禮賓司萬事通</title>
    <style>
        :root {
            --bg-color: #0d0d0e;
            --sidebar-bg: #141416;
            --card-bg: #18181b;
            --input-bg: #222226;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(200, 168, 110, 0.4);
            --text-main: #ffffff;
            --text-sub: #8e8e93;
            --primary: #C8A86E;
            --primary-light: rgba(200, 168, 110, 0.12);
            --primary-btn-text: #121212;
            --accent: #30d158;
            --danger: #ff453a;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            --dock-bg: rgba(24, 24, 27, 0.65);
            --dock-border: rgba(255, 255, 255, 0.14);
            --dock-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
            --dock-active-bg: #ffffff;
            --dock-active-color: #0d0d0e;
            --dock-icon-color: #8e8e93;
        }

        body.light-mode {
            --bg-color: #f5f5f7;
            --sidebar-bg: #ffffff;
            --card-bg: #ffffff;
            --input-bg: #f0f0f4;
            --border-color: rgba(0, 0, 0, 0.08);
            --border-hover: rgba(179, 142, 75, 0.45);
            --text-main: #18181b;
            --text-sub: #6c6c70;
            --primary: #B38E4B;
            --primary-light: rgba(179, 142, 75, 0.12);
            --primary-btn-text: #ffffff;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            --dock-bg: rgba(255, 255, 255, 0.75);
            --dock-border: rgba(255, 255, 255, 0.60);
            --dock-shadow: 0 12px 36px rgba(0, 0, 0, 0.10);
            --dock-active-bg: var(--primary);
            --dock-active-color: #ffffff;
            --dock-icon-color: #71717a;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; transition: background-color 0.25s ease; }
        
        /* 避免鍵盤彈起時 Dock 遮擋輸入 */
        body.keyboard-open .nav-bar { display: none !important; }

        /* Lock Screen Modal */
        #auth-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 28px; width: 100%; max-width: 380px; padding: 32px 24px; text-align: center; box-shadow: var(--shadow); }
        .auth-title { font-size: 22px; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
        .auth-desc { font-size: 13px; color: var(--text-sub); margin-bottom: 24px; line-height: 1.5; }
        .pin-input { width: 100%; padding: 16px; border-radius: 16px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main); font-size: 22px; text-align: center; letter-spacing: 6px; font-weight: 800; margin-bottom: 16px; outline: none; }
        .pin-input:focus { border-color: var(--primary); }
        .pin-btn { width: 100%; padding: 16px; border-radius: 16px; border: none; background: var(--primary); color: var(--primary-btn-text); font-size: 16px; font-weight: 800; cursor: pointer; }

        /* App Layout */
        .app-title { font-size: 18px; font-weight: 800; color: var(--text-main); }
        .role-tag { font-size: 11px; padding: 3px 8px; border-radius: 8px; font-weight: 700; background: var(--primary-light); color: var(--primary); }

        .view-content { display: none; flex-direction: column; gap: 14px; width: 100%; }
        .view-content.active { display: flex; }

        /* Flashcard */
        .flashcard-container { perspective: 1000px; width: 100%; cursor: pointer; }
        .flashcard { width: 100%; min-height: 250px; position: relative; transform-style: preserve-3d; transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 24px; }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 24px; background: var(--card-bg); border: 1px solid var(--border-color); padding: 24px 20px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center; box-shadow: var(--shadow); }
        .card-back { transform: rotateY(180deg); }
        .card-star { position: absolute; top: 18px; right: 20px; font-size: 24px; color: #404040; cursor: pointer; z-index: 10; }
        .card-star.active { color: #f59e0b; }
        .card-badge { font-size: 12px; font-weight: 700; padding: 5px 14px; border-radius: 14px; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--primary); }
        .card-prompt-text { font-weight: 900; color: var(--text-main); margin: auto 0; line-height: 1.35; padding: 0 10px; word-break: break-word; font-size: clamp(24px, 6vw, 36px); }
        .card-subtext { font-size: 13px; color: var(--text-sub); }

        .ans-code { font-size: 32px; font-weight: 900; color: var(--primary); }
        .ans-cn { font-size: 18px; font-weight: 700; color: var(--text-main); margin-top: 6px; white-space: pre-line; line-height: 1.4; }
        .ans-en { font-size: 14px; color: var(--text-sub); margin-top: 4px; }

        /* Actions */
        .action-area { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .input-group { width: 100%; display: flex; gap: 8px; }
        .card-input { flex: 1; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main); font-weight: 600; outline: none; padding: 14px 16px; border-radius: 16px; font-size: 16px; }
        .card-input:focus { border-color: var(--primary); }
        .btn-submit { background: var(--primary); color: var(--primary-btn-text); border: none; font-weight: 800; padding: 0 20px; border-radius: 16px; cursor: pointer; }
        .btn-action { background: var(--primary); color: var(--primary-btn-text); font-weight: 800; border: none; width: 100%; padding: 15px; border-radius: 16px; cursor: pointer; font-size: 15px; }

        /* Self-Assessment buttons for Flip Mode */
        .self-eval-group { display: flex; gap: 10px; width: 100%; }
        .btn-eval-know { flex: 1; background: rgba(48, 209, 88, 0.2); border: 1px solid var(--accent); color: var(--accent); padding: 14px; border-radius: 16px; font-weight: 800; cursor: pointer; }
        .btn-eval-forget { flex: 1; background: rgba(255, 69, 58, 0.2); border: 1px solid var(--danger); color: var(--danger); padding: 14px; border-radius: 16px; font-weight: 800; cursor: pointer; }

        /* Quiz */
        .quiz-card { background: var(--card-bg); border-radius: 22px; padding: 22px; border: 1px solid var(--border-color); box-shadow: var(--shadow); }
        .quiz-q { font-size: 19px; font-weight: 800; margin-bottom: 20px; line-height: 1.4; }
        .quiz-opts { display: flex; flex-direction: column; gap: 10px; }
        .q-opt { background: var(--input-bg); border: 1px solid var(--border-color); padding: 16px; border-radius: 16px; font-weight: 700; font-size: 15px; text-align: left; cursor: pointer; color: var(--text-main); }
        .q-opt.correct { background: rgba(48, 209, 88, 0.2); border-color: var(--accent); color: var(--accent); }
        .q-opt.wrong { background: rgba(255, 69, 58, 0.2); border-color: var(--danger); color: var(--danger); }

        /* Search */
        .search-box { width: 100%; padding: 15px 18px; border-radius: 16px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 15px; outline: none; }
        .list-container { display: flex; flex-direction: column; gap: 8px; }
        .list-item { background: var(--card-bg); padding: 16px; border-radius: 16px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .list-item-left .code { font-weight: 900; font-size: 17px; color: var(--primary); }
        .list-item-left .cn { font-size: 14px; font-weight: 600; color: var(--text-main); margin-top: 3px; white-space: pre-line; line-height: 1.4; }
        .list-item-cat { font-size: 11px; padding: 3px 8px; border-radius: 8px; background: var(--input-bg); color: var(--text-sub); }

        /* Admin backend view */
        .admin-box { background: var(--card-bg); border-radius: 20px; padding: 20px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 14px; }
        .sync-banner { background: var(--primary-light); border: 1px solid var(--border-hover); border-radius: 16px; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
        .admin-table-item { background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }

        /* Floating Nav Dock */
        .nav-bar { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom, 12px)); left: 50%; transform: translateX(-50%); background: var(--dock-bg); backdrop-filter: blur(28px); border: 1px solid var(--dock-border); border-radius: 9999px; box-shadow: var(--dock-shadow); display: flex; align-items: center; gap: 6px; padding: 6px 10px; z-index: 999; }
        .nav-item { display: flex; align-items: center; justify-content: center; width: 48px; height: 42px; border: none; background: transparent; color: var(--dock-icon-color); border-radius: 9999px; cursor: pointer; outline: none; }
        .nav-item.active { background: var(--dock-active-bg); color: var(--dock-active-color); }
        .nav-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; }

        .main-stage { width: 100%; max-width: 600px; margin: 0 auto; padding: 16px 16px 100px 16px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- 雙重密碼驗證彈窗 -->
<div id="auth-modal">
    <div class="auth-card">
        <div class="auth-title">台南晶英 禮賓司萬事通</div>
        <div class="auth-desc">請輸入授權通行碼<br>（同仁練習：1688 ｜ 主管管理：9999）</div>
        <input type="password" id="pin-input" class="pin-input" maxlength="6" placeholder="••••" autocomplete="off">
        <button class="pin-btn" onclick="checkAuthPin()">解鎖進入</button>
    </div>
</div>

<main class="main-stage">
    <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <div>
            <div class="app-title">禮賓司萬事通</div>
            <span class="role-tag" id="user-role-label">學員練習中</span>
        </div>
        <button onclick="toggleTheme()" style="background:var(--input-bg); border:1px solid var(--border-color); color:var(--text-sub); padding:6px 12px; border-radius:20px; font-size:12px; cursor:pointer;">切換外觀</button>
    </header>

    <!-- 1. 學習卡片 -->
    <div id="view-learn" class="view-content active">
        <div class="flashcard-container" onclick="flipCurrentCard()">
            <div class="flashcard" id="main-card">
                <div class="card-face card-front">
                    <span class="card-star" id="card-star" onclick="toggleFav(event)">★</span>
                    <div class="card-badge" id="card-badge">隨機出題</div>
                    <div class="card-prompt-text" id="card-prompt">載入中...</div>
                    <div class="card-subtext" id="card-mode-hint">輸入答案後按 Enter 翻牌 👆</div>
                </div>
                <div class="card-face card-back">
                    <div class="ans-code" id="card-ans-code">--</div>
                    <div class="ans-cn" id="card-ans-cn">--</div>
                    <div class="ans-en" id="card-ans-en"></div>
                    <div class="card-subtext" style="margin-top:auto;">點擊下方按鈕繼續</div>
                </div>
            </div>
        </div>

        <!-- 模式 A：打字作答區（短答案） -->
        <div class="action-area" id="type-action-area">
            <form class="input-group" onsubmit="event.preventDefault(); submitAnswer();">
                <input type="text" class="card-input" id="type-input" placeholder="輸入答案後按 Enter..." autocomplete="off">
                <button type="submit" class="btn-submit">送出</button>
            </form>
            <button class="btn-action hidden" id="next-card-btn" onclick="nextCard()">下一題 ➔</button>
        </div>

        <!-- 模式 B：翻牌自評區（長文本/SOP/營業時間） -->
        <div class="self-eval-group hidden" id="flip-eval-area">
            <button class="btn-eval-know" onclick="recordSelfEval(true)">👍 已熟練掌握</button>
            <button class="btn-eval-forget" onclick="recordSelfEval(false)">🔁 還不熟，再加強</button>
        </div>
    </div>

    <!-- 2. 四選一測驗 -->
    <div id="view-quiz" class="view-content">
        <div class="quiz-card">
            <div class="quiz-q" id="quiz-title">載入中...</div>
            <div class="quiz-opts" id="quiz-options"></div>
        </div>
        <button class="btn-action hidden" id="quiz-next-btn" onclick="nextQuizQuestion()">下一題 ➔</button>
    </div>

    <!-- 3. 代碼與分機速查 -->
    <div id="view-search" class="view-content">
        <input type="text" class="search-box" id="search-input" placeholder="🔍 搜尋代碼、分機號碼、中文或部門..." oninput="renderSearchList()">
        <div class="list-container" id="search-list"></div>
    </div>

    <!-- 4. 設定 -->
    <div id="view-settings" class="view-content">
        <div class="admin-box">
            <h3 style="font-size:16px; color:var(--primary);">題庫範圍過濾</h3>
            <div style="display:flex; flex-direction:column; gap:8px;">
                <button class="btn-action" style="background:var(--input-bg); color:var(--text-main);" onclick="setScope('all')">全選題庫</button>
                <button class="btn-action" style="background:var(--input-bg); color:var(--text-main);" onclick="setScope('opera')">OPERA 代碼</button>
                <button class="btn-action" style="background:var(--input-bg); color:var(--text-main);" onclick="setScope('ext')">分機與電話</button>
                <button class="btn-action" style="background:var(--input-bg); color:var(--text-main);" onclick="setScope('room')">房型規格</button>
                <button class="btn-action" style="background:var(--input-bg); color:var(--text-main);" onclick="setScope('restaurant')">餐廳與設施</button>
            </div>
            <hr style="border:none; border-top:1px solid var(--border-color); margin:10px 0;">
            <button class="btn-action" style="background:var(--input-bg); color:var(--danger);" onclick="resetStats()">清除作答統計與錯題本</button>
            <button class="btn-action" style="background:transparent; border:1px solid var(--border-color); color:var(--text-sub);" onclick="reLogin()">重新輸入通行碼</button>
        </div>
    </div>

    <!-- 5. 主管專屬後台（僅密碼 9999 可見） -->
    <div id="view-admin" class="view-content">
        <div class="admin-box">
            <div class="sync-banner">
                <div>
                    <b style="color:var(--text-main); font-size:15px;">Google 試算表同步</b>
                    <div style="font-size:12px; color:var(--text-sub); margin-top:2px;" id="sync-status-txt">狀態：本機資料庫</div>
                </div>
                <button onclick="syncFromCloud()" style="background:var(--primary); border:none; padding:8px 14px; border-radius:12px; font-weight:800; cursor:pointer;">立即抓取</button>
            </div>

            <div style="display:flex; flex-direction:column; gap:6px;">
                <label style="font-size:12px; color:var(--text-sub);">Google Apps Script Web API 網址：</label>
                <input type="text" id="api-url-input" class="search-box" placeholder="貼上 https://script.google.com/macros/s/.../exec" onchange="saveApiUrl()">
            </div>

            <div style="display:flex; gap:8px;">
                <button class="btn-action" onclick="pushToCloud()">推送本機資料至 Google 試算表</button>
                <button class="btn-action" style="background:var(--input-bg); color:var(--text-main);" onclick="openAddModal()">＋ 新增一筆</button>
            </div>

            <div class="list-container" id="admin-list" style="margin-top:10px; max-height:400px; overflow-y:auto;"></div>
        </div>
    </div>
</main>

<!-- 手機底部 Floating Dock -->
<nav class="nav-bar">
    <button class="nav-item active" onclick="switchTab('learn', this)" title="卡片"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"></rect><line x1="7" y1="8" x2="17" y2="8"></line><line x1="7" y1="12" x2="13" y2="12"></line></svg></button>
    <button class="nav-item" onclick="switchTab('quiz', this)" title="測驗"><svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg></button>
    <button class="nav-item" onclick="switchTab('search', this)" title="速查"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></button>
    <button class="nav-item" onclick="switchTab('settings', this)" title="設定"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
    <button class="nav-item hidden" id="nav-admin-btn" onclick="switchTab('admin', this)" title="管理"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 14.93V17a1 1 0 0 1-2 0v-.07A7.002 7.002 0 0 1 5.07 11H5a1 1 0 0 1 0-2h.07A7.002 7.002 0 0 1 11 5.07V5a1 1 0 0 1 2 0v.07A7.002 7.002 0 0 1 18.93 11H19a1 1 0 0 1 0 2h-.07A7.002 7.002 0 0 1 13 16.93z"></path></svg></button>
</nav>

  { code: "Robin's牛排館營業時段？", cn: "早餐 06:30-10:30\n午餐 12:00-17:00\n晚餐 18:00-22:00", cat: "館內餐廳", type: "restaurant", en: "RB", input_mode: "flip" },
  { code: "水晶廊最後點餐時間？", cn: "營業時間 17:00-00:00\n最後點餐 22:30", cat: "館內餐廳", type: "restaurant", en: "GH", input_mode: "flip" },
  { code: "行政酒廊酒精供應規則？", cn: "20:00前無酒精，僅 20:00-22:00 (Happy Hour) 供應酒精飲品", cat: "館內餐廳", type: "restaurant", en: "SL", input_mode: "flip" }
];

let appDb = [];
let userRole = 'staff'; // 'staff' 或 'admin'
let currentCard = null;
let currentScope = 'all';
let favs = JSON.parse(localStorage.getItem('concierge_favs') || '[]');
let wrongs = JSON.parse(localStorage.getItem('concierge_wrongs') || '[]');
let apiUrl = localStorage.getItem('concierge_api_url') || '';

// 登入驗證
function checkAuthPin() {
    const pin = document.getElementById('pin-input').value.trim();
    if (pin === '9999') {
        userRole = 'admin';
        document.getElementById('user-role-label').innerText = '主管管理員';
        document.getElementById('user-role-label').style.background = 'rgba(48, 209, 88, 0.18)';
        document.getElementById('user-role-label').style.color = '#30d158';
        document.getElementById('nav-admin-btn').classList.remove('hidden');
        document.getElementById('auth-modal').style.display = 'none';
        initApp();
    } else if (pin === '1688') {
        userRole = 'staff';
        document.getElementById('user-role-label').innerText = '同仁練習';
        document.getElementById('nav-admin-btn').classList.add('hidden');
        document.getElementById('auth-modal').style.display = 'none';
        initApp();
    } else {
        alert('通行碼錯誤，請確認（同仁: 1688 ｜ 主管: 9999）');
    }
}

function reLogin() {
    document.getElementById('pin-input').value = '';
    document.getElementById('auth-modal').style.display = 'flex';
}

function initApp() {
    const saved = localStorage.getItem('concierge_db');
    if (saved) {
        try { appDb = JSON.parse(saved); } catch(e) { appDb = initialBaseDb; }
    } else {
        appDb = initialBaseDb;
    }
    document.getElementById('api-url-input').value = apiUrl;
    nextCard();
    nextQuizQuestion();
    renderSearchList();
    if (userRole === 'admin') renderAdminList();
}

function saveLocalDb() {
    localStorage.setItem('concierge_db', JSON.stringify(appDb));
}

// 監聽鍵盤避免遮擋
const typeInput = document.getElementById('type-input');
typeInput.addEventListener('focus', () => document.body.classList.add('keyboard-open'));
typeInput.addEventListener('blur', () => document.body.classList.remove('keyboard-open'));

// 卡片學習邏輯（短答案打字＋長文本翻牌自評）
function getFilteredPool() {
    let pool = appDb;
    if (currentScope !== 'all') {
        pool = appDb.filter(x => x.type === currentScope);
    }
    return pool.length > 0 ? pool : appDb;
}

function nextCard() {
    const pool = getFilteredPool();
    currentCard = pool[Math.floor(Math.random() * pool.length)];

    const card = document.getElementById('main-card');
    card.classList.remove('flipped');
    document.getElementById('card-prompt').innerText = currentCard.code;
    document.getElementById('card-badge').innerText = `【${currentCard.cat}】`;
    document.getElementById('card-ans-code').innerText = currentCard.code;
    document.getElementById('card-ans-cn').innerText = currentCard.cn;
    document.getElementById('card-ans-en').innerText = currentCard.en || '';

    const isFav = favs.includes(currentCard.code);
    document.getElementById('card-star').classList.toggle('active', isFav);

    // 判斷第 2 點：打字題 vs 翻卡題
    const isFlip = currentCard.input_mode === 'flip' || currentCard.cn.length > 15;
    if (isFlip) {
        document.getElementById('type-action-area').classList.add('hidden');
        document.getElementById('flip-eval-area').classList.remove('hidden');
        document.getElementById('card-mode-hint').innerText = '長知識點 · 點擊卡片翻面看解析 👆';
    } else {
        document.getElementById('type-action-area').classList.remove('hidden');
        document.getElementById('flip-eval-area').classList.add('hidden');
        document.getElementById('type-input').value = '';
        document.getElementById('next-card-btn').classList.add('hidden');
        document.getElementById('type-input').style.display = 'block';
        document.getElementById('card-mode-hint').innerText = '輸入答案後按 Enter 翻牌 👆';
    }
}

function flipCurrentCard() {
    document.getElementById('main-card').classList.toggle('flipped');
}

// 短答案打字提交
function submitAnswer() {
    const val = document.getElementById('type-input').value.trim();
    if (!val) return;
    
    const isCorrect = (val.toLowerCase() === currentCard.cn.toLowerCase()) || 
                      (val.toLowerCase() === currentCard.code.toLowerCase());
    
    document.getElementById('main-card').classList.add('flipped');
    document.getElementById('next-card-btn').classList.remove('hidden');
    document.getElementById('type-input').style.display = 'none';

    if (!isCorrect) {
        if (!wrongs.includes(currentCard.code)) wrongs.push(currentCard.code);
    } else {
        wrongs = wrongs.filter(x => x !== currentCard.code);
    }
    localStorage.setItem('concierge_wrongs', JSON.stringify(wrongs));
}

// 翻牌自評（已掌握 / 加強）
function recordSelfEval(known) {
    if (!known) {
        if (!wrongs.includes(currentCard.code)) wrongs.push(currentCard.code);
    } else {
        wrongs = wrongs.filter(x => x !== currentCard.code);
    }
    localStorage.setItem('concierge_wrongs', JSON.stringify(wrongs));
    nextCard();
}

function toggleFav(e) {
    e.stopPropagation();
    if (!currentCard) return;
    const idx = favs.indexOf(currentCard.code);
    if (idx > -1) favs.splice(idx, 1);
    else favs.push(currentCard.code);
    localStorage.setItem('concierge_favs', JSON.stringify(favs));
    document.getElementById('card-star').classList.toggle('active', favs.includes(currentCard.code));
}

// 四選一測驗
function nextQuizQuestion() {
    const pool = getFilteredPool();
    const q = pool[Math.floor(Math.random() * pool.length)];
    document.getElementById('quiz-title').innerText = `【${q.cat}】${q.code} 代表什麼？`;
    document.getElementById('quiz-next-btn').classList.add('hidden');

    let options = [q.cn];
    while (options.length < 4 && options.length < pool.length) {
        const rand = pool[Math.floor(Math.random() * pool.length)].cn;
        if (!options.includes(rand)) options.push(rand);
    }
    options.sort(() => Math.random() - 0.5);

    const container = document.getElementById('quiz-options');
    container.innerHTML = '';
    options.forEach(opt => {
        const div = document.createElement('div');
        div.className = 'q-opt';
        div.innerText = opt;
        div.onclick = () => {
            document.querySelectorAll('.q-opt').forEach(el => el.onclick = null);
            if (opt === q.cn) {
                div.classList.add('correct');
            } else {
                div.classList.add('wrong');
                document.querySelectorAll('.q-opt').forEach(el => { if (el.innerText === q.cn) el.classList.add('correct'); });
            }
            document.getElementById('quiz-next-btn').classList.remove('hidden');
        };
        container.appendChild(div);
    });
}

// 速查搜尋
function renderSearchList() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const container = document.getElementById('search-list');
    container.innerHTML = '';
    const filtered = appDb.filter(x => x.code.toLowerCase().includes(q) || x.cn.toLowerCase().includes(q) || x.cat.includes(q));
    filtered.forEach(x => {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `<div class="list-item-left"><div class="code">${x.code} ${x.en ? `<span style="font-size:12px;color:var(--text-sub);">(${x.en})</span>`:''}</div><div class="cn">${x.cn}</div></div><div class="list-item-cat">${x.cat}</div>`;
        container.appendChild(div);
    });
}

// 切換頁籤
function switchTab(tab, btn) {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.view-content').forEach(el => el.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`view-${tab}`).classList.add('active');
    if (tab === 'search') renderSearchList();
    if (tab === 'admin') renderAdminList();
}

function setScope(scope) {
    currentScope = scope;
    alert(`已切換題庫範圍為：${scope}`);
    nextCard();
    nextQuizQuestion();
}

function resetStats() {
    if (confirm('確定要清空作答歷史與錯題本嗎？')) {
        favs = []; wrongs = [];
        localStorage.removeItem('concierge_favs');
        localStorage.removeItem('concierge_wrongs');
        alert('已清空完畢！');
    }
}

// 主管後台與 Google 試算表雲端同步
function saveApiUrl() {
    apiUrl = document.getElementById('api-url-input').value.trim();
    localStorage.setItem('concierge_api_url', apiUrl);
}

function renderAdminList() {
    const container = document.getElementById('admin-list');
    container.innerHTML = '';
    appDb.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'admin-table-item';
        div.innerHTML = `<div><b>${item.code}</b><div style="font-size:12px;color:var(--text-sub);">${item.cn}</div></div><button onclick="deleteItem(${idx})" style="background:var(--danger);color:#fff;border:none;padding:4px 8px;border-radius:8px;font-size:12px;cursor:pointer;">刪除</button>`;
        container.appendChild(div);
    });
}

function deleteItem(idx) {
    if (confirm(`確定要刪除「${appDb[idx].code}」嗎？`)) {
        appDb.splice(idx, 1);
        saveLocalDb();
        renderAdminList();
    }
}

function openAddModal() {
    const code = prompt('請輸入代碼或題目名稱（如 DK, 3215 或 營業時間）：');
    if (!code) return;
    const cn = prompt('請輸入中文意思或規範答案：');
    if (!cn) return;
    const cat = prompt('請輸入分類（如 房態排房、飯店分機、館內餐廳）：') || '一般';
    const isLong = cn.length > 15;
    appDb.unshift({ code, cn, cat, type: 'opera', en: '', input_mode: isLong ? 'flip' : 'type' });
    saveLocalDb();
    renderAdminList();
    alert('新增成功！');
}

// 雲端同步功能
async function syncFromCloud() {
    if (!apiUrl) return alert('請先填入 Google Apps Script 網頁應用程式網址！');
    const statusTxt = document.getElementById('sync-status-txt');
    statusTxt.innerText = '狀態：正在從雲端抓取...';
    try {
        const res = await fetch(apiUrl);
        const json = await res.json();
        if (json.status === 'success' && Array.isArray(json.data) && json.data.length > 0) {
            appDb = json.data;
            saveLocalDb();
            renderAdminList();
            statusTxt.innerText = `狀態：已與雲端同步（共 ${appDb.length} 筆）`;
            alert('同步成功！');
        } else {
            alert('雲端試算表尚無資料或格式不符');
        }
    } catch(e) {
        alert('連線失敗，請檢查網址或權限設定：' + e);
        statusTxt.innerText = '狀態：連線失敗';
    }
}

async function pushToCloud() {
    if (!apiUrl) return alert('請先填入 Google Apps Script 網頁應用程式網址！');
    if (!confirm('確定要將手機目前的題庫完整覆寫至 Google 試算表嗎？')) return;
    try {
        const res = await fetch(apiUrl, {
            method: 'POST',
            body: JSON.stringify({ adminPin: '9999', action: 'sync_all', items: appDb })
        });
        const json = await res.json();
        if (json.status === 'success') {
            alert(`成功推送 ${json.count} 筆資料至 Google 試算表！`);
        } else {
            alert('推送失敗：' + json.message);
        }
    } catch(e) {
        alert('推送出錯：' + e);
    }
}

function toggleTheme() {
    document.body.classList.toggle('light-mode');
}
</script>
