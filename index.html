<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>OPERA 卡牌大師</title>
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="apple-touch-icon.png">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --input-bg: #2c2c2e;
            --border-color: #38383a;
            --text-main: #ffffff;
            --text-sub: #8e8e93;
            --primary: #C8A86E;
            --primary-light: rgba(200, 168, 110, 0.15);
            --primary-btn-text: #121212;
            --accent: #30d158;
            --danger: #ff453a;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            --nav-bg: #121212;
            --ios-icon-bg: #2c2c2e;
            --ios-icon-stroke: #ffffff;
        }

        body.light-mode {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --input-bg: #e5e5ea;
            --border-color: #c6c6c8;
            --text-main: #000000;
            --text-sub: #6c6c70;
            --primary: #B38E4B;
            --primary-light: rgba(179, 142, 75, 0.12);
            --primary-btn-text: #ffffff;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            --nav-bg: #ffffff;
            --ios-icon-bg: #e5e5ea;
            --ios-icon-stroke: #1c1c1e;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            min-height: 100vh; 
            transition: background-color 0.2s; 
        }

        /* 📱 手機端排版 */
        @media (max-width: 859px) {
            body { 
                min-height: 100dvh; 
                padding-bottom: calc(75px + env(safe-area-inset-bottom, 16px)); 
            }
            .app-container { 
                width: 100%; 
                max-width: 480px; 
                padding: 12px 14px 6px 14px; 
                display: flex; 
                flex-direction: column; 
                justify-content: flex-start; 
                gap: 12px; 
            }
            .stats-bar { padding: 8px 10px; border-radius: 16px; }
            .stat-item .val { font-size: 16px; }
            .flashcard-container { height: clamp(230px, 36vh, 290px); }
            .card-face { padding: 18px 14px; border-radius: 22px; }
            .card-prompt-text { font-size: clamp(28px, 8vw, 42px); }
            .card-prompt-text.long-text { font-size: clamp(20px, 5.5vw, 28px); }
            .card-input { padding: 14px 16px; font-size: 16px; border-radius: 18px; }
            .btn-submit { padding: 0 20px; font-size: 16px; border-radius: 18px; }
            .btn-action { padding: 14px; font-size: 16px; border-radius: 18px; }

            body.keyboard-open { padding-bottom: 0 !important; }
            body.keyboard-open .app-container { padding: 6px 12px !important; gap: 8px !important; }
            body.keyboard-open header,
            body.keyboard-open .stats-bar,
            body.keyboard-open .nav-bar { display: none !important; }
            body.keyboard-open .flashcard-container { height: 165px !important; margin-top: 0 !important; }
            body.keyboard-open .card-face { padding: 12px 14px !important; border-radius: 18px !important; }
            body.keyboard-open .card-prompt-text { font-size: 26px !important; }
            body.keyboard-open .card-prompt-text.long-text { font-size: 18px !important; }
            body.keyboard-open .card-star,
            body.keyboard-open .card-face div[style*="font-size: 13px"] { display: none !important; }
        }

        /* 頂部 Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 2px 2px; }
        .header-left { display: flex; align-items: center; gap: 8px; }
        
        .silks-logo {
            height: 34px;
            width: auto;
            max-width: 42px;
            object-fit: contain;
            display: block;
            transition: filter 0.2s;
        }

        body:not(.light-mode) .silks-logo { filter: brightness(0) invert(1); }
        body.light-mode .silks-logo { filter: none; }

        .app-title { font-size: 19px; font-weight: 800; color: var(--text-main); letter-spacing: 0.5px; transition: color 0.2s; }
        .theme-toggle { background: var(--card-bg); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 20px; cursor: pointer; color: var(--text-main); font-size: 12px; font-weight: 700; transition: 0.2s; }

        .desktop-nav { display: none; }

        /* 數據總覽 Bar */
        .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: var(--card-bg); border: 1px solid var(--border-color); box-shadow: var(--shadow); text-align: center; }
        .stat-item .val { font-weight: 800; color: var(--primary); }
        .stat-item .lbl { font-size: 11px; color: var(--text-sub); margin-top: 1px; }

        .view-content { display: none; flex-direction: column; gap: 12px; width: 100%; }
        .view-content.active { display: flex; }

        .learn-layout { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .desktop-side-panel { display: none; }

        /* 大卡牌核心容器 */
        .flashcard-container { perspective: 1000px; width: 100%; transition: height 0.2s ease; }
        .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 24px; }
        .flashcard.flipped { transform: rotateY(180deg); }
        
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 24px; background: var(--card-bg); border: 1px solid var(--border-color); padding: 22px 18px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center; box-shadow: var(--shadow); }
        .card-back { transform: rotateY(180deg); }

        .card-star { position: absolute; top: 16px; right: 18px; font-size: 24px; color: #404040; cursor: pointer; z-index: 10; }
        .card-star.active { color: #f59e0b; }
        .card-badge { font-size: 12px; font-weight: 800; padding: 5px 14px; border-radius: 14px; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--primary); }
        
        .card-prompt-text { font-weight: 900; letter-spacing: 0.5px; color: var(--text-main); margin: auto 0; line-height: 1.3; padding: 0 10px; word-break: break-word; }

        /* 卡牌背面答案展現 */
        .result-badge { font-size: 15px; font-weight: 800; padding: 6px 16px; border-radius: 18px; }
        .result-badge.correct { background: rgba(48, 209, 88, 0.2); color: var(--accent); border: 1px solid var(--accent); }
        .result-badge.wrong { background: rgba(255, 69, 58, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        .ans-code { font-size: 34px; font-weight: 900; color: var(--primary); margin-top: 4px; word-break: break-word; }
        .ans-cn { font-size: 20px; font-weight: 800; color: var(--text-main); margin-top: 4px; line-height: 1.25; }
        .ans-user { font-size: 13px; color: var(--text-sub); margin-top: 8px; background: var(--input-bg); padding: 5px 12px; border-radius: 10px; border: 1px solid var(--border-color); }

        /* 下方輸入框與按鈕 */
        .action-area { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .input-group { width: 100%; display: flex; gap: 8px; }
        .card-input { flex: 1; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main); font-weight: 700; outline: none; transition: 0.2s; box-shadow: var(--shadow); }
        .card-input:focus { border-color: var(--primary); }
        .btn-submit { background: var(--primary); color: var(--primary-btn-text); border: none; font-weight: 800; cursor: pointer; transition: opacity 0.2s; }
        .btn-submit:active { opacity: 0.85; }
        
        .btn-action { background: var(--primary); color: var(--primary-btn-text); font-weight: 800; border: none; width: 100%; cursor: pointer; transition: opacity 0.2s, background-color 0.2s; }
        .btn-action:active { opacity: 0.85; }
        .hidden { display: none !important; }

        /* 📋 十題測驗成績單結算卡片樣式 */
        .exam-report-card {
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            padding: 24px 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .exam-score-header {
            text-align: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .exam-score-title { font-size: 15px; font-weight: 700; color: var(--text-sub); }
        .exam-score-val { font-size: 52px; font-weight: 900; color: var(--primary); margin: 6px 0; line-height: 1; }
        .exam-score-sub { font-size: 13px; color: var(--text-sub); font-weight: 600; }
        
        .exam-details-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .exam-item-box {
            background: var(--input-bg);
            border-radius: 16px;
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
        }
        .exam-item-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
        }
        .exam-item-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 8px;
            font-weight: 800;
        }
        .exam-item-badge.correct { background: rgba(48, 209, 88, 0.2); color: var(--accent); }
        .exam-item-badge.wrong { background: rgba(255, 69, 58, 0.2); color: var(--danger); }
        .exam-item-row { display: flex; gap: 8px; line-height: 1.4; }
        .exam-item-row .lbl { color: var(--text-sub); min-width: 65px; flex-shrink: 0; }
        .exam-item-row .val { color: var(--text-main); font-weight: 600; }
        .exam-item-row .user-ans.correct { color: var(--accent); font-weight: 700; }
        .exam-item-row .user-ans.wrong { color: var(--danger); font-weight: 700; }

        /* 測驗模式 */
        .quiz-card { background: var(--card-bg); border-radius: 22px; padding: 20px 16px; border: 1px solid var(--border-color); box-shadow: var(--shadow); }
        .quiz-q { font-size: 18px; font-weight: 800; margin-bottom: 16px; line-height: 1.4; }
        .quiz-opts { display: flex; flex-direction: column; gap: 10px; }
        .q-opt { background: var(--input-bg); border: 1px solid var(--border-color); padding: 14px 16px; border-radius: 16px; font-weight: 700; font-size: 15px; text-align: left; cursor: pointer; color: var(--text-main); transition: 0.15s; }
        .q-opt.correct { background: rgba(48, 209, 88, 0.2); border-color: var(--accent); color: var(--accent); }
        .q-opt.wrong { background: rgba(255, 69, 58, 0.2); border-color: var(--danger); color: var(--danger); }

        /* 代碼庫清單 */
        .search-box { width: 100%; padding: 14px 18px; border-radius: 16px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 15px; font-weight: 600; outline: none; }
        .list-container { display: flex; flex-direction: column; gap: 8px; }
        .list-item { background: var(--card-bg); padding: 14px 18px; border-radius: 18px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .list-item-left .code { font-weight: 900; font-size: 17px; color: var(--primary); }
        .list-item-left .cn { font-size: 14px; font-weight: 700; color: var(--text-main); margin-top: 3px; }
        .list-item-cat { font-size: 11px; padding: 3px 8px; border-radius: 8px; background: var(--input-bg); color: var(--text-sub); font-weight: 700; }

        /* iOS 原生設定列表 */
        .ios-group-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            padding: 6px 16px 8px 16px;
            letter-spacing: -0.1px;
        }
        .ios-group {
            background: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .ios-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 16px;
            cursor: pointer;
            position: relative;
            background: var(--card-bg);
            transition: background-color 0.15s;
        }
        .ios-item:not(:last-child)::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 56px;
            right: 0;
            height: 1px;
            background: var(--border-color);
            opacity: 0.6;
        }
        .ios-item:active { background: var(--input-bg); }
        .ios-item-left { display: flex; align-items: center; gap: 14px; }
        
        .ios-icon-box {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--ios-icon-bg);
            flex-shrink: 0;
            transition: background-color 0.2s;
        }
        .ios-icon-box svg {
            width: 17px;
            height: 17px;
            stroke: var(--ios-icon-stroke);
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s;
        }

        .ios-label {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-main);
            letter-spacing: -0.3px;
        }

        .ios-check {
            font-size: 17px;
            font-weight: 700;
            color: var(--primary);
            opacity: 0;
            transform: scale(0.7);
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        .ios-item.active .ios-check {
            opacity: 1;
            transform: scale(1);
        }

        /* 手機底部導覽列 */
        .nav-bar { 
            position: fixed; 
            bottom: 0; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 100%; 
            max-width: 480px; 
            background: var(--nav-bg); 
            border-top: 1px solid var(--border-color); 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            padding-top: 8px;
            padding-bottom: calc(14px + env(safe-area-inset-bottom, 12px)); 
            z-index: 100; 
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; border: none; background: none; color: var(--text-sub); font-size: 11px; font-weight: 700; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .nav-item .icon { font-size: 18px; }

        /* 💻 電腦端擴展佈局（>= 860px） */
        @media (min-width: 860px) {
            body { padding-bottom: 30px; }
            .app-container { max-width: 1120px; padding: 24px 32px; gap: 20px; }
            .nav-bar { display: none !important; }
            .desktop-nav { display: flex; gap: 8px; background: var(--card-bg); padding: 6px; border-radius: 18px; border: 1px solid var(--border-color); }
            .d-nav-item { border: none; background: transparent; padding: 8px 18px; border-radius: 12px; font-size: 14px; font-weight: 700; color: var(--text-sub); cursor: pointer; transition: 0.2s; }
            .d-nav-item.active { background: var(--primary); color: var(--primary-btn-text); }
            .learn-layout { display: grid; grid-template-columns: 580px 1fr; gap: 24px; align-items: start; }
            .flashcard-container { height: 380px; }
            .card-prompt-text { font-size: 46px; }
            .card-prompt-text.long-text { font-size: 32px; }
            .desktop-side-panel { display: flex; flex-direction: column; gap: 16px; height: 100%; }
            .side-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 24px; padding: 20px; box-shadow: var(--shadow); }
            .side-title { font-size: 15px; font-weight: 800; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
            .chart-content-box { display: flex; align-items: center; gap: 20px; padding: 4px 0; }
            .chart-donut { width: 120px; height: 120px; border-radius: 50%; position: relative; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
            .chart-donut::after { content: ''; width: 78px; height: 78px; background: var(--card-bg); border-radius: 50%; position: absolute; }
            .chart-center-info { position: relative; z-index: 2; text-align: center; }
            .chart-center-val { font-size: 22px; font-weight: 900; color: var(--text-main); line-height: 1.1; }
            .chart-center-lbl { font-size: 10px; color: var(--text-sub); margin-top: 2px; }
            .chart-legend { display: flex; flex-direction: column; gap: 8px; flex: 1; }
            .legend-item { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; }
            .legend-left { display: flex; align-items: center; gap: 8px; }
            .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
            .legend-count { color: var(--text-sub); font-size: 12px; }
            .mini-search-box { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main); font-size: 13px; outline: none; margin-bottom: 10px; }
            .mini-list-scroll { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
            .mini-list-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--input-bg); border-radius: 10px; font-size: 13px; }
            .mini-list-item .m-code { font-weight: 800; color: var(--primary); }
            .mini-list-item .m-cn { color: var(--text-sub); font-size: 12px; }
            #view-quiz .quiz-card, #view-settings .ios-group, #view-settings .ios-group-title { max-width: 680px; margin-left: auto; margin-right: auto; width: 100%; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="header-left">
            <img src="silks_logo.png" alt="晶英酒店" class="silks-logo" onerror="this.style.display='none'">
            <div class="app-title">OPERA 卡牌大師</div>
        </div>

        <div class="desktop-nav">
            <button class="d-nav-item active" onclick="switchTab('learn', this)">📖 學習卡片</button>
            <button class="d-nav-item" onclick="switchTab('quiz', this)">📝 考題測驗</button>
            <button class="d-nav-item" onclick="switchTab('search', this)">🔍 代碼與分機</button>
            <button class="d-nav-item" onclick="switchTab('settings', this)">⚙️ 設定</button>
        </div>

        <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">🌙 深色模式</button>
    </header>

    <!-- 數據概況 Bar -->
    <div class="stats-bar">
        <div class="stat-item"><div class="val" id="st-accuracy">0%</div><div class="lbl">正確率</div></div>
        <div class="stat-item"><div class="val" id="st-streak">0</div><div class="lbl">連續答對</div></div>
        <div class="stat-item"><div class="val" id="st-wrong">0</div><div class="lbl">錯題本</div></div>
        <div class="stat-item"><div class="val" id="st-fav">0</div><div class="lbl">收藏數</div></div>
    </div>

    <!-- 1. 學習卡片頁 -->
    <div id="view-learn" class="view-content active">
        <div class="learn-layout">
            <div style="display: flex; flex-direction: column; gap: 8px; width: 100%;">
                
                <!-- 正常刷題卡牌容器 -->
                <div class="flashcard-container" id="learn-card-container">
                    <div class="flashcard" id="main-card">
                        <div class="card-face card-front">
                            <span class="card-star" id="card-star" onclick="toggleFav(event)">★</span>
                            <div class="card-badge" id="card-badge">隨機出題</div>
                            <div class="card-prompt-text" id="card-prompt">--</div>
                            <div style="font-size: 13px; color: var(--text-sub);">輸入後送出翻轉卡片 👆</div>
                        </div>
                        <div class="card-face card-back">
                            <div class="result-badge" id="card-result-badge">🎉 答對了！</div>
                            <div style="margin: auto 0;">
                                <div class="ans-code" id="card-ans-code">VC</div>
                                <div class="ans-cn" id="card-ans-cn">房間已清潔，待查房，不可入住</div>
                                <div class="ans-user" id="card-ans-user">你的輸入：VC</div>
                            </div>
                            <div style="font-size: 13px; color: var(--text-sub);">按 Enter 或點擊「下一題」繼續刷題</div>
                        </div>
                    </div>
                </div>

                <!-- 📋 十題測驗成績單結算容器（預設隱藏） -->
                <div class="exam-report-card hidden" id="exam-report-view">
                    <div class="exam-score-header">
                        <div class="exam-score-title">🏆 十題測驗 成績結算</div>
                        <div class="exam-score-val" id="exam-final-score">100</div>
                        <div class="exam-score-sub" id="exam-final-eval">滿分 100 分 · 一題 10 分</div>
                    </div>
                    <div class="exam-details-list" id="exam-results-list"></div>
                    <div style="display: flex; gap: 10px; margin-top: 4px;">
                        <button class="btn-action" onclick="initExam10()">🔄 再測一次 (全新10題)</button>
                        <button class="btn-action" style="background: var(--input-bg); color: var(--text-main);" onclick="changePool('all')">📖 返回自主學習</button>
                    </div>
                </div>

                <div class="action-area" id="learn-action-area">
                    <form id="input-form" class="input-group" onsubmit="event.preventDefault(); submitAnswer();">
                        <input type="text" class="card-input" id="type-input" placeholder="鍵盤輸入答案後按 Enter 或送出..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                        <button type="submit" class="btn-submit">送出</button>
                    </form>
                    <button class="btn-action hidden" id="next-card-btn" onclick="requestNextCard()">下一題 ➔ (Enter)</button>
                </div>
            </div>

            <!-- 電腦版右側面板 -->

function updateWeaknessChart() {
    const pie = document.getElementById('weakness-pie');
    const legendBox = document.getElementById('chart-legend-box');
    const totalCountEl = document.getElementById('chart-total-count');
    if (!pie || !legendBox) return;

    const totalWrongs = state.wrongs.length;
    totalCountEl.innerText = totalWrongs;

    const catCounts = { "房態排房": 0, "客房備品": 0, "前台禮賓": 0, "貴賓客情": 0, "帳務訂房": 0, "飯店分機": 0 };
    state.wrongs.forEach(code => {
        const item = db.find(x => x.code === code);
        if (item && catCounts[item.cat] !== undefined) {
            catCounts[item.cat]++;
        }
    });

    legendBox.innerHTML = '';

    if (totalWrongs === 0) {
        pie.style.background = `conic-gradient(var(--primary) 0deg 360deg)`;
        legendBox.innerHTML = `
            <div style="font-size: 13px; color: var(--accent); font-weight: 800; line-height: 1.6;">
                ✨ 完美掌控！<br>
                <span style="font-size: 12px; color: var(--text-sub); font-weight: 500;">目前沒有累積任何錯題。繼續答題時會在此即時分析你的易錯類別。</span>
            </div>
        `;
        return;
    }

    let currentAngle = 0;
    const gradParts = [];

    Object.entries(catCounts).forEach(([catName, count]) => {
        const conf = categoryConfig[catName];
        const percent = Math.round((count / totalWrongs) * 100);

        if (count > 0) {
            const angle = (count / totalWrongs) * 360;
            gradParts.push(`${conf.color} ${currentAngle}deg ${currentAngle + angle}deg`);
            currentAngle += angle;
        }

        const div = document.createElement('div');
        div.className = 'legend-item';
        div.innerHTML = `
            <div class="legend-left">
                <div class="legend-dot" style="background: ${conf.color}"></div>
                <span>${catName}</span>
            </div>
            <div class="legend-count">${count > 0 ? `${percent}% (${count}題)` : `<span style="color:var(--text-sub);opacity:0.6;">0%</span>`}</div>
        `;
        legendBox.appendChild(div);
    });

    pie.style.background = `conic-gradient(${gradParts.join(', ')})`;
}

function getScopedDatabase() {
    if (state.scope === 'opera') return db.filter(x => x.type === 'opera');
    if (state.scope === 'ext') return db.filter(x => x.type === 'ext');
    return db;
}

function getPool() {
    const scoped = getScopedDatabase();
    if (state.poolType === 'wrong') {
        const pool = scoped.filter(x => state.wrongs.includes(x.code));
        return pool.length > 0 ? pool : scoped;
    }
    if (state.poolType === 'fav') {
        const pool = scoped.filter(x => state.favs.includes(x.code));
        return pool.length > 0 ? pool : scoped;
    }
    return scoped;
}

function checkChineseMatch(userInput, targetStr) {
    const clean = s => s.toLowerCase().replace(/[\s\-_/，,、。.！!？?（）()]/g, '');
    const u = clean(userInput);
    if (!u || u.length < 1) return false;

    const targetFull = clean(targetStr);
    const targetMain = clean(targetStr.replace(/（.*?）|\(.*?\)/g, ''));

    if (targetFull.includes(u) && (u.length >= 2 || targetFull.length <= 2)) return true;
    if (targetMain && targetMain.includes(u) && (u.length >= 2 || targetMain.length <= 2)) return true;
    if (u.includes(targetMain) && targetMain.length >= 2) return true;

    let matchCount = 0;
    let tempTarget = targetFull;
    for (const char of u) {
        const idx = tempTarget.indexOf(char);
        if (idx > -1) {
            matchCount++;
            tempTarget = tempTarget.slice(0, idx) + tempTarget.slice(idx + 1);
        }
    }

    const precision = matchCount / u.length;
    const baseTarget = targetMain.length >= 2 ? targetMain : targetFull;
    const recall = matchCount / baseTarget.length;

    if (u.length >= 3 && precision >= 0.75 && recall >= 0.6) return true;
    if (u.length >= 4 && precision >= 0.7 && recall >= 0.5) return true;

    return false;
}

function checkCodeMatch(userInput, targetCode) {
    const clean = s => s.trim()
        .replace(/[\uFF0A]/g, '*')
        .toUpperCase()
        .replace(/[\s\-_/]/g, '');

    const u = clean(userInput);
    const t = clean(targetCode);
    if (!u) return false;

    if (t.includes('*')) {
        return u === t;
    }

    if (u === t) return true;

    const rawParts = targetCode.split(/[-\/]/).map(p => clean(p));
    if (rawParts.length === 2 && !isNaN(rawParts[0]) && !isNaN(rawParts[1])) {
        const start = parseInt(rawParts[0], 10);
        const end = parseInt(rawParts[1], 10);
        if (end > start && end - start <= 5) {
            const userNum = parseInt(u, 10);
            if (userNum >= start && userNum <= end) return true;
        }
    }

    if (rawParts.some(part => part === u)) return true;

    return false;
}

let currentCard = null;
let currentDirection = 'code';
let lastSubmitTime = 0;
let isNextCooldown = false;
let isFirstLoad = true;

// 📋 啟動「十題測驗」流程
function initExam10() {
    const scopedList = [...getScopedDatabase()].sort(() => Math.random() - 0.5);
    examSession.questions = scopedList.slice(0, 10);
    examSession.currentIndex = 0;
    examSession.answers = [];
    examSession.score = 0;

    // 還原視圖
    document.getElementById('exam-report-view').classList.add('hidden');
    document.getElementById('learn-card-container').classList.remove('hidden');
    document.getElementById('learn-action-area').classList.remove('hidden');

    nextCard(true);
}

function nextCard(shouldFocus = false) {
    const cardEl = document.getElementById('main-card');
    cardEl.classList.remove('flipped');

    document.getElementById('input-form').classList.remove('hidden');
    document.getElementById('next-card-btn').classList.add('hidden');
    const input = document.getElementById('type-input');
    input.value = '';

    setTimeout(() => {
        // 判斷是否為十題測驗
        if (state.poolType === 'exam10') {
            if (examSession.currentIndex >= 10) {
                showExamResults();
                return;
            }
            currentCard = examSession.questions[examSession.currentIndex];
        } else {
            const pool = getPool();
            currentCard = pool[Math.floor(Math.random() * pool.length)];
        }
        
        currentDirection = Math.random() < 0.5 ? 'code' : 'cn';
        const promptEl = document.getElementById('card-prompt');

        if (state.poolType === 'exam10') {
            document.getElementById('card-badge').innerText = `📋 十題測驗 第 ${examSession.currentIndex + 1} / 10 題 (10分/題)`;
        } else {
            document.getElementById('card-badge').innerText = currentDirection === 'code' ? `【${currentCard.cat}】代碼 ➔ 中文` : `【${currentCard.cat}】中文 ➔ 代碼`;
        }

        if (currentDirection === 'code') {
            input.placeholder = currentCard.type === 'ext' ? '請輸入單位或部門名稱...' : '請輸入中文意思...';
            promptEl.innerText = currentCard.code;
            promptEl.className = currentCard.code.length > 12 ? 'card-prompt-text long-text' : 'card-prompt-text';
        } else {
            input.placeholder = currentCard.type === 'ext' ? '請輸入分機號碼（例: 3225, **777）...' : '請輸入代碼 (例: VC, SSP)...';
            promptEl.innerText = currentCard.cn;
            promptEl.className = currentCard.cn.length > 8 ? 'card-prompt-text long-text' : 'card-prompt-text';
        }

        const isFav = state.favs.includes(currentCard.code);
        document.getElementById('card-star').classList.toggle('active', isFav);

        const isDesktop = window.innerWidth >= 860;
        if ((isDesktop || shouldFocus) && !isFirstLoad) {
            input.focus();
        }
        isFirstLoad = false;
    }, 200);
}

function requestNextCard() {
    if (isNextCooldown) return;
    if (Date.now() - lastSubmitTime < 350) return;

    isNextCooldown = true;
    const btn = document.getElementById('next-card-btn');
    btn.innerText = "⏳ 1 秒後進入下一題...";
    btn.style.opacity = "0.75";
    btn.style.pointerEvents = "none";

    setTimeout(() => {
        btn.innerText = "下一題 ➔ (Enter)";
        btn.style.opacity = "1";
        btn.style.pointerEvents = "auto";
        isNextCooldown = false;

        if (state.poolType === 'exam10') {
            examSession.currentIndex++;
            if (examSession.currentIndex >= 10) {
                showExamResults();
                return;
            }
        }
        nextCard(true);
    }, 1000);
}

function submitAnswer() {
    const input = document.getElementById('type-input');
    const val = input.value.trim();
    if (!val) return;

    lastSubmitTime = Date.now();
    input.blur();

    state.stats.total++;
    let isCorrect = false;

    if (currentDirection === 'code') {
        isCorrect = checkChineseMatch(val, currentCard.cn);
    } else {
        isCorrect = checkCodeMatch(val, currentCard.code);
    }

    // 📋 十題測驗計分紀錄
    if (state.poolType === 'exam10') {
        if (isCorrect) examSession.score += 10;
        examSession.answers.push({
            card: currentCard,
            direction: currentDirection,
            userVal: val,
            isCorrect: isCorrect
        });
    }

    if (isCorrect) {
        state.stats.correct++;
        state.stats.streak++;
        const wIdx = state.wrongs.indexOf(currentCard.code);
        if (wIdx > -1) state.wrongs.splice(wIdx, 1);
    } else {
        state.stats.streak = 0;
        if (!state.wrongs.includes(currentCard.code)) state.wrongs.push(currentCard.code);
    }
    saveState();

    const resBadge = document.getElementById('card-result-badge');
    resBadge.className = `result-badge ${isCorrect ? 'correct' : 'wrong'}`;
    resBadge.innerText = isCorrect ? '🎉 答對了！(+10分)' : '❌ 答錯了！(0分)';

    document.getElementById('card-ans-code').innerText = currentCard.code;
    document.getElementById('card-ans-cn').innerText = currentCard.cn;
    document.getElementById('card-ans-user').innerText = `你的回答：${val}`;

    document.getElementById('main-card').classList.add('flipped');

    document.getElementById('input-form').classList.add('hidden');
    const nextBtn = document.getElementById('next-card-btn');
    if (state.poolType === 'exam10' && examSession.currentIndex === 9) {
        nextBtn.innerText = "查看成績結算 ➔ (Enter)";
    } else {
        nextBtn.innerText = "下一題 ➔ (Enter)";
    }
    nextBtn.classList.remove('hidden');
}

// 📋 展現十題測驗結算成績單
function showExamResults() {
    document.getElementById('learn-card-container').classList.add('hidden');
    document.getElementById('learn-action-area').classList.add('hidden');
    
    const reportView = document.getElementById('exam-report-view');
    reportView.classList.remove('hidden');

    document.getElementById('exam-final-score').innerText = examSession.score;
    const evalText = examSession.score === 100 ? "🌟 滿分完美！全數正確！" : examSession.score >= 80 ? "👏 優秀！已掌握多數代碼！" : "💪 繼續加油！多練習錯題本！";
    document.getElementById('exam-final-eval').innerText = `${evalText}（滿分 100 分 · 一題 10 分）`;

    const listEl = document.getElementById('exam-results-list');
    listEl.innerHTML = '';

    examSession.answers.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'exam-item-box';
        const qPrompt = item.direction === 'code' ? item.card.code : item.card.cn;
        const qTarget = item.direction === 'code' ? item.card.cn : item.card.code;

        div.innerHTML = `
            <div class="exam-item-top">
                <span>第 ${idx + 1} 題（${item.card.cat}）</span>
                <span class="exam-item-badge ${item.isCorrect ? 'correct' : 'wrong'}">${item.isCorrect ? '+10分 正確' : '0分 錯誤'}</span>
            </div>
            <div class="exam-item-row">
                <span class="lbl">出題題目：</span>
                <span class="val">${qPrompt}</span>
            </div>
            <div class="exam-item-row">
                <span class="lbl">你的回答：</span>
                <span class="user-ans ${item.isCorrect ? 'correct' : 'wrong'}">${item.userVal}</span>
            </div>
            <div class="exam-item-row">
                <span class="lbl">正確解答：</span>
                <span class="val">${qTarget}（完整：${item.card.code} - ${item.card.cn}）</span>
            </div>
        `;
        listEl.appendChild(div);
    });
}

function toggleFav(e) {
    e.stopPropagation();
    if (!currentCard) return;
    const idx = state.favs.indexOf(currentCard.code);
    if (idx > -1) state.favs.splice(idx, 1);
    else state.favs.push(currentCard.code);
    saveState();
    document.getElementById('card-star').classList.toggle('active', state.favs.includes(currentCard.code));
}

let currentQuiz = null;
let currentQuizType = 'code2cn';

function nextQuizQuestion() {
    document.getElementById('quiz-next-btn').classList.add('hidden');
    const activeScopedList = getScopedDatabase();
    currentQuiz = activeScopedList[Math.floor(Math.random() * activeScopedList.length)];
    currentQuizType = Math.random() < 0.5 ? 'code2cn' : 'cn2code';

    let targetAnswer = "";
    let opts = [];

    if (currentQuizType === 'code2cn') {
        const labelName = currentQuiz.type === 'ext' ? '分機號碼' : '代碼';
        document.getElementById('quiz-title').innerText = `【 ${currentQuiz.code} 】（${currentQuiz.cat}）代表什麼？`;
        targetAnswer = currentQuiz.cn;
        opts = [targetAnswer];
        while (opts.length < 4 && opts.length < activeScopedList.length) {
            let rand = activeScopedList[Math.floor(Math.random() * activeScopedList.length)].cn;
            if (!opts.includes(rand)) opts.push(rand);
        }
    } else {
        const labelName = currentQuiz.type === 'ext' ? '分機/電話' : '代碼';
        document.getElementById('quiz-title').innerText = `【 ${currentQuiz.cn} 】（${currentQuiz.cat}）的${labelName}是？`;
        targetAnswer = currentQuiz.code;
        opts = [targetAnswer];
        while (opts.length < 4 && opts.length < activeScopedList.length) {
            let rand = activeScopedList[Math.floor(Math.random() * activeScopedList.length)].code;
            if (!opts.includes(rand)) opts.push(rand);
        }
    }

    opts.sort(() => Math.random() - 0.5);

    const container = document.getElementById('quiz-options');
    container.innerHTML = '';

    opts.forEach(o => {
        const div = document.createElement('div');
        div.className = 'q-opt';
        div.innerText = o;
        div.onclick = () => checkQuiz(div, o, targetAnswer);
        container.appendChild(div);
    });
}

function checkQuiz(btn, selected, target) {
    const all = document.querySelectorAll('.q-opt');
    all.forEach(x => x.onclick = null);

    lastQuizAnswerTime = Date.now();
    state.stats.total++;

    if (selected === target) {
        btn.classList.add('correct');
        state.stats.correct++;
        state.stats.streak++;
        const wIdx = state.wrongs.indexOf(currentQuiz.code);
        if (wIdx > -1) state.wrongs.splice(wIdx, 1);
    } else {
        btn.classList.add('wrong');
        state.stats.streak = 0;
        all.forEach(x => { if (x.innerText === target) x.classList.add('correct'); });
        if (!state.wrongs.includes(currentQuiz.code)) state.wrongs.push(currentQuiz.code);
    }
    saveState();
    const qBtn = document.getElementById('quiz-next-btn');
    qBtn.innerText = "下一題 ➔ (Enter)";
    qBtn.classList.remove('hidden');
}

function changeScope(scope) {

    else nextCard(false);
    nextQuizQuestion();

}

function changePool(type) {

    if (type === 'exam10') {
        switchTab('learn', document.querySelectorAll('.nav-item')[0]);

        document.getElementById('learn-action-area').classList.remove('hidden');

}

function renderSearchList() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const container = document.getElementById('search-list');
    container.innerHTML = '';

    const filtered = db.filter(x => x.code.toLowerCase().includes(q) || x.cn.includes(q) || x.cat.includes(q));

        div.className = 'list-item';

function renderMiniSearch() {
    const q = (document.getElementById('mini-search')?.value || '').toLowerCase();
    const container = document.getElementById('mini-search-list');
    if (!container) return;
    container.innerHTML = '';

    const activeScopedList = getScopedDatabase();
    const filtered = activeScopedList.filter(x => x.code.toLowerCase().includes(q) || x.cn.includes(q) || x.cat.includes(q)).slice(0, 15);
    filtered.forEach(x => {

        div.className = 'mini-list-item';
        div.innerHTML = `
            <span class="m-code">${x.code}</span>

function switchTab(tab, btn) {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    document.querySelectorAll('.d-nav-item').forEach(i => i.classList.remove('active'));
    document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));

    const activeIndex = ['learn', 'quiz', 'search', 'settings'].indexOf(tab);

        document.querySelectorAll('.nav-item')[activeIndex]?.classList.add('active');
        document.querySelectorAll('.d-nav-item')[activeIndex]?.classList.add('active');

    document.getElementById(`view-${tab}`).classList.add('active');
    if (tab === 'search') renderSearchList();
}

function applyThemeUI() {
    const btn = document.getElementById('theme-btn');
    if (state.theme === 'light') {
        document.body.classList.add('light-mode');
        btn.innerText = '🌙 深色模式';
    } else {
        document.body.classList.remove('light-mode');
        btn.innerText = '☀️ 淺色模式';
    }
}

function resetAllData() {
    if (confirm("確定要重置所有紀錄與錯題本嗎？")) {
        localStorage.removeItem('opera_app_data');
        state = { favs: [], wrongs: [], stats: { total: 0, correct: 0, streak: 0 }, theme: 'dark', poolType: 'all', scope: 'all' };
        saveState();
        applyThemeUI();
        alert("資料已重置！");
        location.reload();
    }
}

loadState();
nextCard(false);
nextQuizQuestion();
renderMiniSearch();
</script>
